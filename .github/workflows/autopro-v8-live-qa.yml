name: AutoPro V8 — deployed organized header QA

on:
  push:
    branches: ['design/autopro-v8-header-organization']
    paths:
      - '.github/workflows/autopro-v8-live-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      AUTOPRO_BASE_URL: https://autopro-v8-carstore-preview.mouadbusni.workers.dev
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Validate real Worker HTML, CSS, JavaScript and disabled API
        run: |
          curl -fsS --retry 12 --retry-delay 5 --retry-all-errors "$AUTOPRO_BASE_URL/" > /tmp/autopro-v8-live.html
          grep -q 'AutoPro' /tmp/autopro-v8-live.html
          grep -q 'logo-main' /tmp/autopro-v8-live.html
          if curl -fsS "$AUTOPRO_BASE_URL/site.css" | grep -q 'FULL-WIDTH edge anchors above'; then
            echo "Edge-aligned upper header and centered secondary navigation stylesheet is live"
          else
            echo "Expected header alignment stylesheet is missing"
            exit 1
          fi
          curl -fsS "$AUTOPRO_BASE_URL/site.css" | grep -q 'category-tile'
          curl -fsS "$AUTOPRO_BASE_URL/app.js" | grep -q 'autopro-carstore-v8'
          test "$(curl -sS -o /dev/null -w '%{http_code}' "$AUTOPRO_BASE_URL/api/products")" = "404"
          echo "Real deployed CarStore-inspired frontend passed HTTP checks"
      - name: Install dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Create live screenshot folder
        run: mkdir -p cloudflare/carstore-v8/screenshots
      - name: Run full live desktop and mobile browser suite
        run: npx playwright test --config cloudflare/carstore-v8/playwright.config.ts --workers=1
      - name: Upload real deployed site screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: autopro-v8-LIVE-organized-header
          path: cloudflare/carstore-v8/screenshots/
          if-no-files-found: ignore
          retention-days: 14
      - name: Upload failure traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: autopro-v8-LIVE-header-errors
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7