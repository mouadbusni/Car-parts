name: AutoPro v4 — isolated visual regression QA

on:
  push:
    branches: ['design/autopro-visual-refinement-v4']
    paths:
      - 'cloudflare/preview-site/index.html'
      - 'cloudflare/preview-site/app.js'
      - 'cloudflare/cinematic/site.css'
      - 'cloudflare/cinematic/tests/**'
      - 'cloudflare/cinematic/playwright.config.ts'
      - '.github/workflows/autopro-v4-visual-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser:
    name: Desktop + mobile component, navigation and catalog QA
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      AUTOPRO_BASE_URL: http://127.0.0.1:4173
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Install browser
        run: npx playwright install --with-deps chromium
      - name: Check JavaScript syntax
        run: |
          node --check cloudflare/preview-site/app.js
          node --check cloudflare/cinematic/tests/local-server.mjs
      - name: Start isolated preview with empty test inventory
        run: |
          node cloudflare/cinematic/tests/local-server.mjs > /tmp/autopro-v4-server.log 2>&1 &
          for n in {1..20}; do
            if curl --fail --silent http://127.0.0.1:4173/api/health > /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/autopro-v4-server.log
          exit 1
      - name: Create screenshot directory
        run: mkdir -p cloudflare/cinematic/screenshots
      - name: Real Chromium visual and interaction tests
        run: npx playwright test --config cloudflare/cinematic/playwright.config.ts --workers=1
      - name: Validate nonempty screenshots
        run: |
          python3 -m pip install --quiet --break-system-packages pillow
          python3 - <<'PY'
          from PIL import Image,ImageStat
          from pathlib import Path
          for name in ('desktop.jpg','mobile.jpg'):
              f=Path('cloudflare/cinematic/screenshots')/name
              im=Image.open(f).convert('RGB')
              spread=ImageStat.Stat(im).stddev
              assert im.width>=390 and im.height>=844,(name,im.size)
              assert max(spread)>25,(name,'Screenshot may be blank')
              print(name, im.size, f.stat().st_size, spread)
          PY
      - name: Upload visual review screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: autopro-v4-desktop-mobile-visual-review
          path: cloudflare/cinematic/screenshots/
          if-no-files-found: ignore
          retention-days: 14
      - name: Upload browser traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: autopro-v4-regression-failure-traces
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
