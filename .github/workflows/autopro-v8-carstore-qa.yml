name: AutoPro V8 — organized header visual QA

on:
  push:
    branches: ['design/autopro-v8-header-organization']
    paths:
      - 'cloudflare/carstore-v8/**'
      - 'cloudflare/frontend/**'
      - '.github/workflows/autopro-v8-carstore-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  visual:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      AUTOPRO_BASE_URL: http://127.0.0.1:4177
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install existing locked dependencies
        run: npm ci
      - name: Validate storefront syntax and bundle
        run: |
          node --check cloudflare/carstore-v8/app.js
          node --check cloudflare/frontend/tests/local-server.mjs
          node cloudflare/frontend/build.mjs
          node --check cloudflare/frontend/dist/worker.mjs
      - name: Test self-contained Worker (no backend or write operations)
        run: node --test cloudflare/frontend/tests/worker.test.mjs
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Start isolated local preview
        run: |
          node cloudflare/frontend/tests/local-server.mjs > /tmp/autopro-v8-server.log 2>&1 &
          for n in {1..25}; do
            if curl --fail --silent http://127.0.0.1:4177/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/autopro-v8-server.log
          exit 1
      - name: Create capture directory
        run: mkdir -p cloudflare/carstore-v8/screenshots
      - name: Exercise actual desktop and mobile interface
        run: npx playwright test --config cloudflare/carstore-v8/playwright.config.ts --workers=1
      - name: Validate captured screenshots
        run: |
          python3 -m pip install --quiet --break-system-packages pillow
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image,ImageStat
          for name in ('desktop.jpg','mobile.jpg'):
              p=Path('cloudflare/carstore-v8/screenshots')/name
              im=Image.open(p).convert('RGB')
              assert im.width>=390 and im.height>=800,(name,im.size)
              assert max(ImageStat.Stat(im).stddev)>24,(name,'blank/low detail screenshot')
              print(name,im.size,p.stat().st_size)
          PY
      - name: Upload desktop and mobile review images
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: autopro-v8-reference-clone-screenshots
          path: cloudflare/carstore-v8/screenshots/
          if-no-files-found: ignore
          retention-days: 14
      - name: Upload failed browser traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: autopro-v8-failure-traces
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7