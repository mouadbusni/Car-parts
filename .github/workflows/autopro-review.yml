name: AutoPro cart and authentication review

on:
  pull_request:
    branches: [main]
    paths:
      - 'components/**'
      - 'app/cart/**'
      - 'app/products/**'
      - 'app/admin/**'
      - 'app/api/admin-session/**'
      - 'app/login/**'
      - 'middleware.ts'
      - 'scripts/create-admin.js'
      - 'ADMIN_SETUP.md'
      - 'supabase/migrations/**'
      - 'tests/autopro-order-rls.sh'
      - 'lib/cart-store.ts'
      - 'lib/admin-auth.ts'
      - 'tests/autopro-*'
      - '.github/workflows/autopro-review.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: Source, TypeScript, cart and security browser QA
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Verify source regressions
        run: node --test tests/autopro-audit.test.mjs tests/autopro-cart-source.test.mjs tests/autopro-auth-source.test.mjs
      - name: TypeScript validation
        run: npm run typecheck
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run real browser cart flow with mock Supabase reads
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://autopro-test.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: autopro-qa-public-mock-key
        run: npx playwright test tests/autopro-cart.spec.ts tests/autopro-auth.spec.ts --project=chromium --project="Mobile Chrome" --workers=1 --reporter=line
      - name: Upload browser trace on failures
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: autopro-cart-traces
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7

  order-permissions:
    name: Simulated PostgreSQL 17 RLS protection
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: autopro_ci_only
          POSTGRES_DB: autopro_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d autopro_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: autopro_ci_only
      PGDATABASE: autopro_test
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL client
        run: |
          command -v psql >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y postgresql-client; }
      - name: Exercise schema and deny forged order writes
        run: bash tests/autopro-order-rls.sh
