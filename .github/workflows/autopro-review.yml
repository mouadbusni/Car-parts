name: AutoPro focused source review

on:
  pull_request:
    branches: [main]
    paths:
      - 'components/header.tsx'
      - 'components/hero-section.tsx'
      - 'app/products/page.tsx'
      - 'tests/autopro-audit.test.mjs'
      - '.github/workflows/autopro-review.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: Search, navigation and TypeScript checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Verify source regressions
        run: node --test tests/autopro-audit.test.mjs
      - name: TypeScript validation
        run: npm run typecheck
