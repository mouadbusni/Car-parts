name: AutoPro Cloudflare D1 catalog staging review

on:
  push:
    branches: ['backend/autopro-cloudflare-d1']
  pull_request:
    branches: ['fix/autopro-search-navigation-audit']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  worker-and-schema:
    name: D1 schema and read-only Worker behavior
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate Cloudflare Worker API
        run: node --test tests/autopro-cloudflare-api.test.mjs
      - name: Verify D1 SQLite constraints
        run: python3 -m unittest discover -s tests -p autopro-d1-schema.test.py -v
      - name: TypeScript regression
        run: |
          npm ci
          npm run typecheck
